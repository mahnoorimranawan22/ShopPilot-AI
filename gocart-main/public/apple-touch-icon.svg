<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Shopping cart -->
  <g transform="translate(28, 28)" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3h17l14 68h62l12-48H60"/>
    <circle cx="68" cy="102" r="8" fill="white"/>
    <circle cx="102" cy="102" r="8" fill="white"/>
  </g>
  <!-- AI sparkle -->
  <circle cx="150" cy="30" r="18" fill="url(#ai)"/>
  <text x="150" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="22" fill="white">AI</text>
</svg>
