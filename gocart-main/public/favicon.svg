<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f97316" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Main rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Shopping cart icon -->
  <g transform="translate(10, 10)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 1h6l5 24h22l4-16H14"/>
    <circle cx="18" cy="36" r="3" fill="white"/>
    <circle cx="34" cy="36" r="3" fill="white"/>
  </g>
  <!-- AI sparkle dot -->
  <circle cx="52" cy="12" r="7" fill="url(#ai)"/>
  <text x="52" y="16" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="9" fill="white">AI</text>
</svg>
